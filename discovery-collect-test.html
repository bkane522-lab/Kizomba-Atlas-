<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">

  <title>Kizomba Atlas — Test Collector</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080b18;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 620px;
      background: #11172a;
      border: 1px solid #303a59;
      border-radius: 22px;
      padding: 28px;
    }

    .brand {
      color: #d4af37;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    h1 {
      margin: 12px 0;
      font-size: 34px;
    }

    p {
      color: #b9c0d4;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 22px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #394563;
      background: #090d19;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #d4af37;
      color: #080b18;
      font-size: 17px;
      font-weight: bold;
    }

    pre {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #05070d;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 500px;
      overflow: auto;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="brand">
      KIZOMBA ATLAS CONTROL
    </div>

    <h1>Test Collector</h1>

    <p>
      Lance manuellement la collecte avant d'activer l'automatisation Cron.
      Rien n'est publié automatiquement sur la carte.
    </p>

    <label for="secret">
      DISCOVERY_COLLECT_SECRET
    </label>

    <input
      id="secret"
      type="password"
      placeholder="Colle ta clé ici"
    >

    <button id="start">
      Lancer la collecte
    </button>

    <pre id="result"></pre>

  </div>

  <script>
    const button = document.getElementById("start");
    const secretInput = document.getElementById("secret");
    const result = document.getElementById("result");

    button.addEventListener("click", async function () {

      const secret = secretInput.value.trim();

      if (!secret) {
        result.style.display = "block";
        result.textContent = "Entre ta clé DISCOVERY_COLLECT_SECRET.";
        return;
      }

      button.disabled = true;
      button.textContent = "Collecte en cours...";

      try {

        const response = await fetch("/api/discovery-collect", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            collector_secret: secret
          })
        });

        const text = await response.text();

        let data;

        try {
          data = JSON.parse(text);
        } catch {
          data = {
            raw: text
          };
        }

        result.style.display = "block";

        result.textContent = JSON.stringify(
          {
            http_status: response.status,
            ...data
          },
          null,
          2
        );

      } catch (error) {

        result.style.display = "block";

        result.textContent = JSON.stringify(
          {
            ok: false,
            error: error.message
          },
          null,
          2
        );
      }

      button.disabled = false;
      button.textContent = "Lancer la collecte";
    });
  </script>

</body>
</html>
