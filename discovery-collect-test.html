<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <title>
    Kizomba Atlas — Test Collector
  </title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #080b18;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 620px;
      background: #11172a;
      border: 1px solid #2b3554;
      border-radius: 20px;
      padding: 24px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .eyebrow {
      color: #d4af37;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    h1 {
      margin: 8px 0 10px;
      font-size: 30px;
    }

    p {
      color: #b9c0d4;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: 700;
    }

    input {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      border: 1px solid #394563;
      border-radius: 12px;
      background: #090d19;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #d4af37;
      color: #080b18;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    pre {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #05070d;
      white-space: pre-wrap;
      word-break: break-word;
      color: #d8e0f4;
      max-height: 520px;
      overflow: auto;
    }

    .success {
      border: 1px solid #2f8653;
    }

    .error {
      border: 1px solid #b94e58;
    }

    .info {
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      background: #0b1120;
      color: #aeb7cd;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="eyebrow">
      KIZOMBA ATLAS CONTROL
    </div>

    <h1>
      Test Collector
    </h1>

    <p>
      Lance man
